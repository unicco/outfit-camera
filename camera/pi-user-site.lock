# 玄関 Pi（本番）の user site-packages の実体。システム Python 3.11 / aarch64。
# 本番の正典はこのファイル。camera/requirements.txt はローカル開発用で、版は一致しない。
#
# apt が提供するものは含まない。picamera2 / libcamera / gpiozero / lgpio だけでなく、
# anyio が要求する sniffio のように **PyPI 由来でも apt 側に入っている**ものも同様で、
# pip はそれらを解決済として扱う（だから user site に現れない）。
#
# ⚠️ 拡張子を .txt / .in にしない。Dependabot の pip はその 2 つだけを候補にし、ルート側の
#    updater が camera/ を 1 階層降りて拾う。本番の実体を Dependabot に上げさせてはいけない。
# ⚠️ 更新は Pi 実機で scripts/maintenance/clean-pi-python.sh --apply を通し、
#    撮影 → VPS アップロード → 検出まで確認してからコミットする。
#
# 手順と根拠: docs/deployment/dependency-management.md
