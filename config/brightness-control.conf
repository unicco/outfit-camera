# Display Brightness Control Configuration

# Backlight device path
# 空にして display-brightness.sh の自動検出に任せる。i2c バス採番が起動毎に
# 10-0045 / 11-0045 と揺れるため固定するとデバイス不在警告が出る（実機は 1 台のみ）。
BACKLIGHT_DEVICE=""

# Brightness levels (0-255)
BRIGHT_LEVEL=255
DIM_LEVEL=10
OFF_LEVEL=0

# Power states
POWER_ON=0
POWER_OFF=1

# UI URL for health check (touchscreen interface)
# ⚠️ 素の代入にしない。この conf は kiosk-display-manager.sh が source するので、
# plain 代入だと systemd の EnvironmentFile / drop-in で渡した値を握り潰す
UI_URL="${UI_URL:-http://100.64.0.10:3000/touchscreen}"

# Kiosk browser settings - Wayland optimized
BROWSER_COMMAND="/usr/bin/chromium"
BROWSER_FLAGS="--kiosk --no-first-run --disable-infobars --disable-session-crashed-bubble --disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows --disable-features=TranslateUI,VizDisplayCompositor --disable-dev-shm-usage --no-sandbox --enable-features=UseOzonePlatform --ozone-platform=wayland --disable-gpu-sandbox --disable-software-rasterizer --noerrdialogs --disable-translate --disable-restore-session-state --block-new-web-contents"
# ⚠️ URL のパスでプロセスを引いている。開く画面を変えたらここも変えないと
# stop/restart の pkill が空振りする（生存監視は PID ベースなので落ちはしない）。
# `${VAR:-...}` の理由は上と同じ
BROWSER_PROCESS_NAME="${BROWSER_PROCESS_NAME:-chromium.*touchscreen}"

# キオスクブラウザの PID と起動ロックの置き場
# kiosk-display-manager.sh が書き、kiosk-health-monitor.sh が読む。片方だけ変えると
# 監視が「ブラウザ不在」と誤判定して毎分再起動を打つので、ここで 1 か所に持つ
BROWSER_PID_FILE="${BROWSER_PID_FILE:-/tmp/kiosk-browser.pid}"
BROWSER_LOCK_FILE="${BROWSER_LOCK_FILE:-/tmp/kiosk-browser.lock}"

# Timeout settings (seconds)
HEALTH_CHECK_TIMEOUT=5
HEALTH_CHECK_MAX_ATTEMPTS=30
BROWSER_STARTUP_DELAY=10
GRACEFUL_SHUTDOWN_DELAY=3
