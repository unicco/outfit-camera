# 本体の /etc/systemd/journald.conf にある Storage=volatile を上書きする（conf.d の
# ドロップインが本体より優先される）。この Pi は撮影が済むと自分で halt するので、
# volatile では調べたい前回 boot のログが消える。
#
# SystemMaxUse: microSD の書き込み寿命を守るため上限は必ず set する。無制限にしない
# SyncIntervalSec: 既定 5 分では、ハングして電源をぶつ切りにされたとき
#   直前のログが tmpfs に残ったまま消える。そこが一番調べたい場面なので短くする
[Journal]
Storage=persistent
SystemMaxUse=200M
SyncIntervalSec=1m
